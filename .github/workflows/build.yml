name: Build macOS app
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (Intel x86_64, macOS 13+)
        run: swift build -c release --arch x86_64
      - name: Package .app
        run: |
          BIN=$(swift build -c release --arch x86_64 --show-bin-path)/ClaudeGuide
          scripts/make_app.sh "$BIN" dist
          cd dist && ditto -c -k --keepParent ClaudeGuide.app ClaudeGuide-intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeGuide-intel
          path: dist/ClaudeGuide-intel.zip
